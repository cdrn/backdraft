services:
  # All three seismographs — delta (:4747), funding (:4748), spread (:4749) —
  # in one process. Each keeps its own SQLite DB under /app/data. No paid
  # RPC: every data source is a keyless public endpoint.
  seismograph:
    image: ghcr.io/cdrn/backdraft:latest
    container_name: seismograph
    restart: unless-stopped
    env_file: .env
    environment:
      - DELTA_DB_PATH=/app/data/delta.db
      - FUNDING_DB_PATH=/app/data/funding.db
      - SPREAD_DB_PATH=/app/data/spread.db
    ports:
      - "127.0.0.1:4747:4747"
      - "127.0.0.1:4748:4748"
      - "127.0.0.1:4749:4749"
    volumes:
      - seismograph-data:/app/data

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 seismograph

volumes:
  seismograph-data:
